<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 310" width="1280" height="310" role="img" aria-label="Giuseppe Ruggiero — Computer Engineer &amp; Cybersecurity Profile Banner">
  <defs>
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020203"/>
      <stop offset="55%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>
    <linearGradient id="accentStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="28%" stop-color="#F59E0B"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="subtleSpot" cx="82%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#162238" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#020203" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#17181E" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Obsidian Canvas -->
  <rect x="0" y="0" width="1280" height="310" rx="18" fill="url(#obsidianBg)"/>
  <rect x="0" y="0" width="1280" height="310" rx="18" fill="url(#gridPattern)"/>
  <rect x="0" y="0" width="1280" height="310" rx="18" fill="url(#subtleSpot)"/>
  <rect x="1" y="1" width="1278" height="308" rx="17" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Multi-Spectrum Accent Rule -->
  <rect x="36" y="1" width="1208" height="3" rx="1.5" fill="url(#accentStrip)" opacity="0.92"/>

  <!-- Left Role Tag -->
  <rect x="48" y="38" width="224" height="30" rx="15" fill="#0F2942" stroke="#38BDF8" stroke-width="1.2"/>
  <circle cx="67" cy="53" r="4.5" fill="#38BDF8"/>
  <text x="82" y="57.5" fill="#7DD3FC" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="0.8">JUNIOR CYBERSECURITY</text>

  <!-- Primary Heading -->
  <text x="48" y="122" fill="#F8FAFC" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">Giuseppe Ruggiero</text>
  <text x="48" y="160" fill="#CBD5E1" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="19.5" font-weight="500">Computer Engineer  &#183;  M.Sc. Candidate in Cybersecurity  &#183;  Naples, Italy</text>
  <text x="48" y="188" fill="#94A3B8" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400">Blue/Red Teaming  &#183;  OT/ICS Edge Defense  &#183;  AppSec &amp; SAST  &#183;  Explainable AI for Intrusion Detection</text>

  <!-- Bottom 3 Flagship Domain Pills -->
  <g transform="translate(48, 224)">
    <!-- Pill 1: Red/Blue SIEM -->
    <rect x="0" y="0" width="246" height="44" rx="10" fill="#1C0C16" stroke="#F43F5E" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="5" fill="#F43F5E"/>
    <text x="34" y="20" fill="#FDA4AF" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="11.5" font-weight="700">ENTERPRISE IOT SIEM</text>
    <text x="34" y="35" fill="#CBD5E1" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5">Wazuh &#183; Snort &#183; Pentbox</text>

    <!-- Pill 2: OT/ICS TinyML -->
    <rect x="262" y="0" width="246" height="44" rx="10" fill="#081C17" stroke="#10B981" stroke-width="1.2"/>
    <circle cx="282" cy="22" r="5" fill="#10B981"/>
    <text x="296" y="20" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="11.5" font-weight="700">OT/ICS &amp; AI-SOC</text>
    <text x="296" y="35" fill="#CBD5E1" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5">Cortex-M7 &#183; TinyML &#183; Qwen 2.5</text>

    <!-- Pill 3: IoMT XAI -->
    <rect x="524" y="0" width="246" height="44" rx="10" fill="#140F28" stroke="#A78BFA" stroke-width="1.2"/>
    <circle cx="544" cy="22" r="5" fill="#A78BFA"/>
    <text x="558" y="20" fill="#DDD6FE" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="11.5" font-weight="700">EXPLAINABLE IOMT IDS</text>
    <text x="558" y="35" fill="#CBD5E1" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5">PyTorch &#183; SHAP &#183; Attention</text>
  </g>

  <!-- Right Obsidian Topology Emblem -->
  <g transform="translate(888, 36)">
    <rect x="0" y="0" width="344" height="238" rx="14" fill="#07080B" stroke="#1E293B" stroke-width="1.4"/>
    <line x1="20" y1="34" x2="324" y2="34" stroke="#17181E" stroke-width="1"/>
    <circle cx="24" cy="18" r="4.5" fill="#F43F5E"/>
    <circle cx="40" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="56" cy="18" r="4.5" fill="#10B981"/>
    <text x="320" y="22" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="11">@giusepperuggiero-sec</text>

    <!-- Central Defense Hexagon & Shield -->
    <polygon points="172,56 232,90 232,158 172,192 112,158 112,90" fill="#091929" stroke="#38BDF8" stroke-width="1.8"/>
    <polygon points="172,72 218,98 218,150 172,176 126,150 126,98" fill="#07080B" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Lucide Shield-Check centered inside hexagon -->
    <g transform="translate(148, 100) scale(2.0)" fill="none" stroke="#38BDF8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
      <path d="m9 12 2 2 4-4"/>
    </g>

    <!-- Satellite Nodes Connected to Central Defense Shield -->
    <line x1="72" y1="88" x2="112" y2="108" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="58" cy="82" r="18" fill="#1C0C16" stroke="#F43F5E" stroke-width="1.4"/>
    <text x="58" y="86" text-anchor="middle" fill="#FDA4AF" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="10.5" font-weight="700">RED</text>

    <line x1="72" y1="164" x2="112" y2="144" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="58" cy="170" r="18" fill="#081C17" stroke="#10B981" stroke-width="1.4"/>
    <text x="58" y="174" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="10.5" font-weight="700">OT</text>

    <line x1="272" y1="88" x2="232" y2="108" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="286" cy="82" r="18" fill="#091929" stroke="#38BDF8" stroke-width="1.4"/>
    <text x="286" y="86" text-anchor="middle" fill="#7DD3FC" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="10.5" font-weight="700">SOC</text>

    <line x1="272" y1="164" x2="232" y2="144" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="286" cy="170" r="18" fill="#140F28" stroke="#A78BFA" stroke-width="1.4"/>
    <text x="286" y="174" text-anchor="middle" fill="#DDD6FE" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="10.5" font-weight="700">XAI</text>

    <text x="172" y="218" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="11">Defense-in-Depth  &#183;  Edge to SIEM</text>
  </g>
</svg>
